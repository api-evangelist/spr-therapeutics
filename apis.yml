aid: spr-therapeutics
name: SPR Therapeutics
description: 'SPR Therapeutics, Inc. is a Cleveland, Ohio medical device company that develops and commercializes
  the SPRINT Peripheral Nerve Stimulation (PNS) System, a non-opioid, minimally invasive percutaneous
  therapy for chronic and acute pain. SPRINT is the only percutaneous PNS device FDA-cleared for both
  chronic and acute pain that does not require permanent implantation: leads are placed in an outpatient
  procedure without surgery, incisions or anesthesia and deliver up to 60 days of therapy. The company
  was acquired by Medtronic plc on 2026-07-16 for $650 million and now operates within the Medtronic Neuromodulation
  Operating Unit. SPR is a device manufacturer rather than a software vendor: it publishes no public API,
  developer portal, SDK or machine-readable contract. Its only software surfaces are the consumer SPRINT
  PNS Patient App and the credentialed SPRcare provider reimbursement portal, neither of which exposes
  a public integration.'
